[project]
name = "ittu-backend"
version = "0.1.0"
description = "ITTU — AI financial-crime forensics platform (backend, FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "dramatiq[redis]>=1.17",
    "httpx>=0.27",
    "redis>=5.0",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "pandas>=2.2",
    "numpy>=2.0",
    "reportlab>=4.2",
    "pyjwt>=2.8",
    # Pinned below 1.92: 1.92.0 ships no wheel for some platforms (py3.13/Windows)
    # and its sdist build needs Rust. 1.91.2 has a ready py3-none-any wheel.
    "litellm>=1.91.2,<1.92",
    # LIVE auth (P-4b): verifies Google OAuth id_tokens (app/auth/router.py
    # POST /api/auth/google). app/auth/router.py still tolerates it being
    # absent (501 stub) — a real dependency here, not an optional extra, since
    # LIVE Google login is a production path, not a dev/test-only tool.
    "google-auth>=2.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # In-process throwaway Postgres for the RLS isolation tests (no Docker needed) —
    # see tests/test_rls_isolation.py.
    "pgserver>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
