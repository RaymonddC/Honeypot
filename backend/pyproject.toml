[project]
name = "ittu-backend"
version = "0.1.0"
description = "ITTU — AI financial-crime forensics platform (backend, FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "dramatiq[redis]>=1.17",
    "httpx>=0.27",
    "redis>=5.0",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "pandas>=2.2",
    "numpy>=2.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
