services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ittu
      POSTGRES_PASSWORD: ittu
      POSTGRES_DB: ittu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ittu -d ittu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # For local dev, run backend/frontend on the host (see README).
  # Uncomment to run the backend containerized:
  # backend:
  #   build: ./backend
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     ITTU_DATABASE_URL: postgresql+asyncpg://ittu:ittu@postgres:5432/ittu
  #     ITTU_REDIS_URL: redis://redis:6379/0
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  pgdata:
