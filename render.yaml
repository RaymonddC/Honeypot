# Render Blueprint — deploys the ITTU FastAPI backend as a Docker web service.
# Setup: Render → New → Blueprint → connect this repo → apply.
# autoDeploy:true → redeploys on every push to the connected branch.
# NOTE: after the first deploy, set ITTU_CORS_ORIGINS to your Vercel frontend URL.
services:
  - type: web
    name: ittu-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free            # free tier sleeps after ~15 min idle → first hit cold-starts (~30-60s)
    region: singapore     # closest Render region to Indonesia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ITTU_MODE
        value: poc
      - key: ITTU_JWT_SECRET
        generateValue: true          # Render mints a secure random secret
      - key: ITTU_CORS_ORIGINS
        # The deployed frontend origin(s) allowed to call the API.
        value: '["https://honeypot-brown.vercel.app"]'
